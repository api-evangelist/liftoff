aid: liftoff
name: Liftoff
description: >-
  Liftoff (onliftoff.com, formerly liftoff.xyz) is a B2B network-based hiring and
  networking platform for startup leaders and hiring managers. Rather than cold
  applications or job-board sourcing, companies create a job search, attach a
  self-set "Match Incentive" referral bonus, and share the search link with their
  own network or with Liftoff's curated "Top Connectors" — senior leaders who
  refer pre-vetted candidates from their professional circles. Candidates surface
  through 2nd- and 3rd-degree trusted connections, and companies pay on a
  success-only basis, with fees due after a new hire completes 90 days. Liftoff
  targets seed-to-Series-B technology companies, primarily in the New York City
  and San Francisco ecosystems, and positions itself between LinkedIn recruiting
  and traditional retained search. Backed by Forerunner Ventures. Liftoff
  publishes no public API, SDK, or developer portal; it does publish an llms.txt
  for AI agent grounding. Not to be confused with Liftoff Mobile (liftoff.io, ad
  tech) or useLiftoff (useliftoff.com, job-seeker interview practice).
